services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrivision
      POSTGRES_USER: agrivision
      POSTGRES_PASSWORD: agrivision_dev_only
    ports: ['5432:5432']
    volumes: ['agrivision_pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrivision -d agrivision']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  agrivision_pgdata:
